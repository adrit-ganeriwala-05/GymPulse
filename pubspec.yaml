name: gympulse
description: "GymPulse - workout tracking app with clean architecture."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^8.1.3
  get_it: ^7.6.4
  go_router: ^13.2.0
  equatable: ^2.0.5
  bloc_concurrency: ^0.2.5
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  table_calendar: ^3.0.9
  flutter_animate: ^4.5.0
  google_fonts: ^6.1.0
  sqflite: ^2.3.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
